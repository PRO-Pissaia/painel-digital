<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#102635">
<title>Painel Digital</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#071722;color:#f4f7f9}
body{overflow:hidden}
.screen{width:100%;height:100%;min-height:600px;padding:12px;background:linear-gradient(135deg,#102b3b,#071722);display:grid;grid-template-columns:25% 49% 26%;grid-template-rows:52% 48%;gap:8px}
.panel{background:rgba(5,23,34,.88);border:1px solid rgba(155,190,207,.22);border-radius:5px;overflow:hidden}
.left{grid-column:1;grid-row:1/3;padding:18px;display:flex;flex-direction:column}

/* RELÓGIO CORRIGIDO PARA iOS 10 */
.clock{font-size:64px;font-weight:300;letter-spacing:0px;line-height:1.05;white-space:nowrap;color:#ffffff}

.date{font-size:15px;color:#c4d3db;margin:8px 0 18px}
.smalltitle{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#83a5b8;margin-bottom:9px}

/* PLAYER DE RÁDIO NATIVO */
.radio-box{border-top:1px solid #294655;padding-top:14px;margin-top:2px}
.radio-buttons{display:flex;gap:7px;margin-bottom:10px}
.radio-button{flex:1;border:1px solid #4c8297;border-radius:4px;background:#173d50;color:#eaf5f8;padding:10px 5px;font-size:13px;font-weight:bold;cursor:pointer}
.radio-button.active{background:#26718a;border-color:#78c7d8}
.play-btn{width:100%;border:1px solid #59a582;border-radius:4px;background:#1e6b4b;color:#ffffff;padding:12px;font-size:15px;font-weight:bold;cursor:pointer;margin-bottom:8px}
.play-btn.playing{background:#9e3b3b;border-color:#d66b6b}
.radio-status{font-size:11px;color:#a9c0cb;line-height:1.35;margin-bottom:8px}
.radio-open{display:block;text-align:center;color:#a9dce8;font-size:11px;margin-top:6px;text-decoration:underline}

.photo-controls{margin-top:auto}
.pick{display:block;text-align:center;padding:11px 12px;border:1px solid #4c8297;border-radius:4px;color:#eaf5f8;font-size:13px;background:#173d50;cursor:pointer}
#photoInput{display:none}
.hint{font-size:10px;color:#91a9b5;line-height:1.4;margin-top:8px}

.mainphoto{grid-column:2;grid-row:1;position:relative;background:#102b3b;display:flex;align-items:center;justify-content:center}
.mainphoto img{width:100%;height:100%;object-fit:cover;
